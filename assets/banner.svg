<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Olá, sou Alexandre Santos. Desenvolvedor Full Stack com foco em Back-end.">
  <title>Olá, sou Alexandre Santos</title>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="280" rx="16" fill="url(#hero)"/>
